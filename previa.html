<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prévia grátis · Geometria Ilustrada · Questão Ilustrada</title>
<meta name="description" content="Baixe grátis a prévia da Geometria Ilustrada: o capítulo 1 da apostila, com a fórmula explicada no desenho.">
<meta property="og:title" content="Prévia grátis: Geometria Ilustrada">
<meta property="og:description" content="Baixe o capítulo 1 da apostila, grátis.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<script>document.documentElement.classList.add('anim')</script>
<style>
/* Página de links da bio. Fundo fixo cobrindo a tela inteira; coluna central mais larga no computador. */
:root{--bg:#0D0E0F;--bg2:#141618;--bg3:#18232B;--giz:#F4F1E8;--tx:#D9D6CC;--mut:#9AA1A6;--az:#8CC8E6;--az2:#2C7BA6;--line:rgba(244,241,232,.10);
  --ease:cubic-bezier(.16,1,.3,1);--back:cubic-bezier(.34,1.56,.64,1);color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--az);outline-offset:3px;border-radius:14px}
/* fundo da página inteira */
.fundo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fundo .quad{position:absolute;inset:-60px;background-image:linear-gradient(rgba(230,226,214,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(230,226,214,.045) 1px,transparent 1px);background-size:60px 60px;animation:desliza 40s linear infinite}
@keyframes desliza{to{transform:translate(60px,60px)}}
.fundo .g1,.fundo .g2,.fundo .g3{position:absolute;border-radius:50%;filter:blur(20px)}
.fundo .g1{left:50%;top:-240px;width:900px;height:560px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(140,200,230,.18),transparent)}
.fundo .g2{left:-200px;top:45%;width:620px;height:620px;background:radial-gradient(closest-side,rgba(140,200,230,.08),transparent);animation:flutua 18s ease-in-out infinite}
.fundo .g3{right:-220px;bottom:-200px;width:700px;height:700px;background:radial-gradient(closest-side,rgba(44,123,166,.14),transparent);animation:flutua 22s ease-in-out infinite reverse}
@keyframes flutua{50%{transform:translate(40px,-50px)}}
.fundo svg.fig{position:absolute;opacity:.5}
.fundo .f1{right:-80px;top:120px;width:420px}.fundo .f2{left:-60px;bottom:40px;width:340px}
.fig *{fill:none;stroke-linecap:round}
.fig .t{stroke-dasharray:1;stroke-dashoffset:0}.anim .fig .t{stroke-dashoffset:1;animation:trim 3s var(--ease) forwards;animation-delay:var(--d,0s)}
#po{position:absolute;inset:0;width:100%;height:100%}
main{position:relative;z-index:1;width:100%;max-width:560px;margin:0 auto;padding-block:44px calc(36px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;min-height:100svh}
@media(min-width:900px){main{max-width:760px;padding-block:64px 48px}}

/* perfil */
.ava{position:relative;width:104px;height:104px;border-radius:30px;background:var(--bg2);display:grid;place-items:center;box-shadow:0 0 0 1px var(--line),0 20px 50px rgba(0,0,0,.5)}
.ava::before{content:"";position:absolute;inset:-3px;border-radius:33px;padding:2px;background:conic-gradient(from var(--ang,0deg),transparent 0 65%,rgba(140,200,230,.95) 80%,transparent 92%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:gira 5s linear infinite}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes gira{to{--ang:360deg}}
.ava svg{width:78px;height:78px}
.lg .t{stroke-dasharray:1;stroke-dashoffset:0}
.anim .lg .t{stroke-dashoffset:1;animation:trim 1.3s var(--ease) forwards;animation-delay:var(--d,0s)}
.anim .lg .gr{animation:aparece .8s ease 1.1s both}@keyframes aparece{from{opacity:0}}
@keyframes trim{to{stroke-dashoffset:0}}
h1{font-family:Sora,Inter,sans-serif;font-weight:800;font-size:clamp(26px,3.4vw,34px);letter-spacing:-.02em;color:var(--giz);margin:18px 0 2px;text-align:center}
h1 span{background:linear-gradient(transparent 58%,rgba(140,200,230,.42) 58%,rgba(140,200,230,.42) 92%,transparent 92%);background-size:100% 100%;background-repeat:no-repeat}
.anim h1 span{background-size:0% 100%;animation:pinta .9s var(--ease) 1.2s forwards}@keyframes pinta{to{background-size:100% 100%}}
.arroba{font-size:14px;color:var(--mut)}
.bio{margin:12px 0 0;text-align:center;color:var(--tx);font-size:16px;max-width:34ch}

/* dica de toque */
.dica{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:8px 16px 8px 12px;border-radius:999px;background:rgba(140,200,230,.1);border:1px solid rgba(140,200,230,.3);color:var(--giz);font-size:14px;font-weight:600}
.dica svg{width:22px;height:22px;animation:toque 1.6s ease-in-out infinite}
@keyframes toque{0%,100%{transform:translateY(0)}50%{transform:translateY(4px) scale(.92)}}

/* blocos */
.bloco{width:100%;margin-top:30px}
.rot{display:flex;align-items:center;gap:12px;font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--az);margin-bottom:14px}
.rot::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(140,200,230,.4),transparent)}

/* botões: estado de toque */
.tap{position:relative;overflow:hidden;isolation:isolate;-webkit-tap-highlight-color:transparent;transition:transform .35s var(--ease),border-color .3s,box-shadow .35s,background .3s}
.tap:active{transform:scale(.96)!important}
.tap .rp{position:absolute;border-radius:50%;background:rgba(140,200,230,.35);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none;z-index:-1}
@keyframes rp{to{transform:scale(4);opacity:0}}


main{min-height:100svh;justify-content:center;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px}
@media(min-width:900px){main{padding-block:24px}}
.ava{width:68px;height:68px;border-radius:20px}.ava::before{border-radius:23px}.ava svg{width:50px;height:50px}
h1{margin:12px 0 4px;font-size:clamp(28px,7.4vw,40px);line-height:1.08}
.tag{display:inline-block;margin-top:12px;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:var(--az);color:#0D0E0F;border-radius:999px;padding:5px 12px}
.sub{margin:6px 0 0;text-align:center;font-size:clamp(14px,3.8vw,17px);max-width:34ch;color:var(--tx)}
.stack{position:relative;width:min(78vw,300px);height:clamp(150px,29svh,250px);margin:16px auto 6px}
.stack .pg{position:absolute;top:0;height:100%;width:auto;aspect-ratio:1/1.415;border-radius:10px;object-fit:cover;object-position:top;box-shadow:0 22px 50px rgba(0,0,0,.65),0 0 0 1px rgba(244,241,232,.25);background:#fff}
.stack .p1{left:2%;transform:rotate(-7deg);animation:fl1 6s ease-in-out infinite}
.stack .p2{right:2%;top:14px;transform:rotate(6deg);animation:fl2 7s ease-in-out infinite}
@keyframes fl1{50%{transform:rotate(-5deg) translateY(-8px)}}@keyframes fl2{50%{transform:rotate(8deg) translateY(7px)}}
.anim .stack .pg{opacity:0;animation-fill-mode:both}
.anim .stack .p1{animation:ent2a .9s var(--ease) .5s both,fl1 6s ease-in-out 1.4s infinite}
.anim .stack .p2{animation:ent2b .9s var(--ease) .7s both,fl2 7s ease-in-out 1.6s infinite}
@keyframes ent2a{from{opacity:0;transform:translate(-60px,50px) rotate(-22deg)}to{opacity:1;transform:rotate(-7deg)}}
@keyframes ent2b{from{opacity:0;transform:translate(60px,50px) rotate(22deg)}to{opacity:1;transform:rotate(6deg)}}
.stack::after{content:"12 págs";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:var(--bg);border:1.5px solid rgba(140,200,230,.7);color:var(--az);font:700 12px Sora,Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:5px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.chips span{font-size:12.5px;font-weight:600;color:var(--giz);border:1px solid rgba(140,200,230,.45);border-radius:999px;padding:6px 12px;background:rgba(140,200,230,.08)}
.baixar{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin-top:18px;padding:17px 20px;border-radius:18px;background:var(--az);color:#0D0E0F;font-family:Sora,Inter,sans-serif;font-weight:800;font-size:clamp(17px,4.6vw,20px);box-shadow:0 18px 44px -12px rgba(140,200,230,.65);animation:chama2 2.6s ease-in-out 2s infinite}
.baixar svg{width:24px;height:24px;animation:seta 1.4s ease-in-out infinite}
@keyframes seta{50%{transform:translateY(4px)}}
@keyframes chama2{0%,100%{box-shadow:0 18px 44px -12px rgba(140,200,230,.65),0 0 0 0 rgba(140,200,230,0)}50%{box-shadow:0 18px 44px -12px rgba(140,200,230,.65),0 0 0 8px rgba(140,200,230,.2)}}
.baixar::after{content:"";position:absolute;inset:-30% auto -30% -60%;width:35%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:brilho 4.2s ease-in-out 2s infinite}
.baixar{overflow:hidden}
.baixar:hover{transform:translateY(-3px)}
@keyframes brilho{0%,60%{left:-70%}100%{left:140%}}
.mais{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:12px;padding:13px 16px;border-radius:16px;background:linear-gradient(150deg,#1A2B35,#141618 65%);border:1.5px solid rgba(140,200,230,.5);color:var(--giz);font-size:14.5px;font-weight:600}
.mais b{font-family:Sora,Inter,sans-serif;color:var(--az);white-space:nowrap}.mais s{color:var(--mut);font-weight:500;margin-right:4px;font-size:12px}
.mais:hover{border-color:var(--az);transform:translateY(-3px)}
footer{margin-top:14px;padding-top:0;text-align:center}
@media(max-height:700px){.stack{height:130px;margin-top:10px}.chips{margin-top:14px}.tag{margin-top:8px}.sub{display:none}}
@media(min-width:900px){.stack{height:min(260px,30svh);width:340px}}
@media(max-height:820px) and (min-width:900px){.sub{display:none}}
</style>
</head>
<body style="margin:0">
<div class="fundo" aria-hidden="true">
  <div class="quad"></div><div class="g1"></div><div class="g2"></div><div class="g3"></div>
  <svg class="fig f1" viewBox="0 0 400 400"><circle class="t" pathLength="1" cx="200" cy="200" r="170" stroke="rgba(244,241,232,.10)" stroke-width="2"/><path class="t" pathLength="1" d="M200 30 L347 285 L53 285 Z" stroke="rgba(244,241,232,.10)" stroke-width="2" style="--d:.4s"/><path class="t" pathLength="1" d="M200 30 L200 285" stroke="rgba(140,200,230,.28)" stroke-width="2.5" style="--d:.9s"/></svg>
  <svg class="fig f2" viewBox="0 0 300 300"><path class="t" pathLength="1" d="M40 260 L260 260 L40 60 Z" stroke="rgba(244,241,232,.10)" stroke-width="2" style="--d:.6s"/><path class="t" pathLength="1" d="M260 260 L40 60" stroke="rgba(140,200,230,.26)" stroke-width="2.5" style="--d:1.2s"/><path class="t" pathLength="1" d="M40 238 L62 238 L62 260" stroke="rgba(244,241,232,.12)" stroke-width="2" style="--d:1.5s"/></svg>
  <canvas id="po"></canvas>
</div>
<main>
  <div class="ava ent" style="--d:.05s"><svg class="lg" viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-label="Logo Questão Ilustrada" role="img">
      <rect class="gr" x="17" y="52" width="66" height="26" rx="5" transform="rotate(-4 50 65)" fill="#8CC8E6" opacity=".34"/>
      <rect class="t" pathLength="1" x="6" y="6" width="88" height="88" rx="18" stroke="#F4F1E8" stroke-width="5"/>
      <path class="t" pathLength="1" d="M26 74 L74 74 L26 26 Z" stroke="#F4F1E8" stroke-width="5" style="--d:.3s"/>
      <path class="t" pathLength="1" d="M74 74 L26 26" stroke="#8CC8E6" stroke-width="6" style="--d:.6s"/>
      <path class="t" pathLength="1" d="M26 62 L38 62 L38 74" stroke="#F4F1E8" stroke-width="3" style="--d:.8s"/>
      <path class="t" pathLength="1" d="M58 74 A16 16 0 0 1 62.7 62.7" stroke="#F4F1E8" stroke-width="3" style="--d:.9s"/>
    </svg></div>
  <span class="tag ent" style="--d:.15s">Prévia grátis · Capítulo 1</span>
  <h1 class="ent" style="--d:.22s">Veja a <span>Geometria Ilustrada</span> por dentro</h1>
  <p class="sub ent" style="--d:.3s">Baixe o capítulo 1 da apostila e veja de onde vem a fórmula, no desenho.</p>
  <div class="stack ent" style="--d:.34s"><img class="pg p1" src="pg-ap1.webp" alt="Capa da apostila Geometria Ilustrada"><img class="pg p2" src="pg-ap5.webp" alt="Página do capítulo 1: Teorema de Pitágoras"></div>
  <div class="chips ent" style="--d:.42s"><span>PDF</span><span>Grátis</span><span>Sem cadastro</span></div>
  <a class="baixar tap ent" style="--d:.5s" href="Geometria_Ilustrada_PREVIA_GRATIS.pdf" download>
    <svg viewBox="0 0 24 24" fill="none" stroke="#0D0E0F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 11l5 5 5-5M5 20h14"/></svg>Baixar prévia grátis</a>
  <a class="mais tap ent" style="--d:.58s" href="/geometria">Quero a apostila completa <b><s>R$ 57,90</s>R$ 27,90 →</b></a>
  <footer class="ent" style="--d:.65s">@questaoilustrada</footer>
</main>
<script>
(()=>{
const RED=matchMedia('(prefers-reduced-motion: reduce)').matches;
document.querySelectorAll('.tap').forEach(el=>el.addEventListener('pointerdown',e=>{if(RED)return;const r=el.getBoundingClientRect(),s=Math.max(r.width,r.height)/2,rp=document.createElement('span');rp.className='rp';
  rp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;el.appendChild(rp);setTimeout(()=>rp.remove(),650)}));
if(RED)return;
const c=document.getElementById('po'),x=c.getContext('2d');let W,H,ps=[];
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}
rs();addEventListener('resize',rs);
const N=Math.round(Math.min(60,Math.max(28,innerWidth/28)));
for(let i=0;i<N;i++)ps.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.4,v:.06+Math.random()*.2,a:.05+Math.random()*.2,s:Math.random()*6,az:Math.random()<.25});
(function f(t){x.clearRect(0,0,W,H);ps.forEach(p=>{p.y-=p.v;p.x+=Math.sin(t/2600+p.s)*.12;if(p.y<-4){p.y=H+4;p.x=Math.random()*W}
  x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=p.az?`rgba(140,200,230,${p.a})`:`rgba(244,241,232,${p.a})`;x.fill()});requestAnimationFrame(f)})(0);
})();
</script>
</body>
</html>
